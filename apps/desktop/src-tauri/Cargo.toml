[package]
name = "righteo"
version = "0.1.0"
description = "Working memory for people building with AI"
authors = ["Righteo contributors"]
license = "MIT"
repository = "https://github.com/gommo/righteo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "righteo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
